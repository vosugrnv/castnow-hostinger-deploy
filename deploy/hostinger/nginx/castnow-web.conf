# CastNow marketing site → next start (pm2 castnow-web)
# Domains: castnowvietnam.com www.castnowvietnam.com
# Behind Cloudflare: set SSL mode Flexible or Full (not Full Strict unless origin has cert).

server {
    listen 80;
    listen [::]:80;
    server_name castnowvietnam.com www.castnowvietnam.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
